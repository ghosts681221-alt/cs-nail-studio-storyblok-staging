name: Deploy Storyblok static staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch_storyblok:
        description: "Fetch current published Storyblok content before building"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Build staging site
        run: |
          if [ "$FETCH_STORYBLOK" = "true" ]; then
            node scripts/fetch-storyblok-content.mjs
          fi
          pnpm build
        env:
          FETCH_STORYBLOK: ${{ inputs.fetch_storyblok || 'false' }}
          STORYBLOK_DELIVERY_TOKEN: ${{ secrets.STORYBLOK_DELIVERY_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
